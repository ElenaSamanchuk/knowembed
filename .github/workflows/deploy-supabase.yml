name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ingest-document --project-ref buwxmfapwampgpwvnulb
          supabase functions deploy chat --project-ref buwxmfapwampgpwvnulb
          supabase functions deploy publish-bot --project-ref buwxmfapwampgpwvnulb
          supabase functions deploy public-chat --project-ref buwxmfapwampgpwvnulb
          supabase functions deploy public-bot --project-ref buwxmfapwampgpwvnulb
          supabase functions deploy create-checkout-session --project-ref buwxmfapwampgpwvnulb
          supabase functions deploy stripe-webhook --project-ref buwxmfapwampgpwvnulb --no-verify-jwt
