name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://buwxmfapwampgpwvnulb.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1d3htZmFwd2FtcGdwd3ZudWxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTg4MTQsImV4cCI6MjEwMDc5NDgxNH0.jFBstVbn1AVBLTXhTBthH-Huy7s_bq-0__uKvtF1CV4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test

      - name: Install Playwright
        run: npx playwright install chromium

      - run: npm run test:e2e

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: GITHUB_PAGES=true npm run build
        env:
          VITE_SUPABASE_URL: https://buwxmfapwampgpwvnulb.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ1d3htZmFwd2FtcGdwd3ZudWxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTg4MTQsImV4cCI6MjEwMDc5NDgxNH0.jFBstVbn1AVBLTXhTBthH-Huy7s_bq-0__uKvtF1CV4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
