<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embed demo — KnowEmbed</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, sans-serif;
        background: linear-gradient(145deg, #f4f1ea 0%, #e8eef5 100%);
        color: #1a1f2e;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px 120px;
      }
      h1 {
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        margin-bottom: 0.5rem;
      }
      p {
        line-height: 1.6;
        color: #4a5568;
      }
      .card {
        margin-top: 2rem;
        padding: 1.25rem 1.5rem;
        border-radius: 16px;
        background: #fff;
        border: 1px solid #dbe2ea;
        box-shadow: 0 12px 40px rgba(26, 31, 46, 0.06);
      }
      code {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Acme Store</h1>

      <div class="card">
        <strong>Try it:</strong> open the chat in the bottom-right and ask “How long is shipping?”
